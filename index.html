<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-agpl" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="EVO-X - The Ultimate AI Successor"
    />
    <title>EVO-X Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-deep-space: #0d1117;
        --bg-space: #161b22;
        --bg-panel: #21262d;
        --border-primary: #30363d;
        --text-primary: #c9d1d9;
        --text-secondary: #8b949e;
        --accent-orange: #f77829;
        --accent-orange-hover: #e66a1d;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: var(--bg-deep-space);
        color: var(--text-primary);
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
        background-size: 2.5rem 2.5rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-space);
      }
      ::-webkit-scrollbar-thumb {
        background: #444c56;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #586069;
      }
      *:focus-visible {
        outline: 2px solid var(--accent-orange) !important;
        outline-offset: 2px !important;
        border-radius: 2px;
      }
      /* Custom Slider Styles */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        background: var(--bg-deep-space);
        border-radius: 4px;
        outline: none;
        padding: 0;
        margin: 0;
        transition: opacity .2s;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        background: var(--accent-orange);
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid var(--bg-panel);
      }
      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: var(--accent-orange);
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid var(--bg-panel);
      }
      input[type="range"]::-moz-range-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: var(--bg-deep-space);
        border-radius: 4px;
      }
      
      /* EVO-X Avatar Animations */
      @keyframes evo-idle-breathe {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      @keyframes evo-think-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes evo-speak-wave {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      /* Chatbot Ambient BG */
      @keyframes ambient-background-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .chatbot-container::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(-45deg, var(--bg-deep-space), rgba(247, 120, 41, 0.08), var(--bg-deep-space), var(--bg-panel));
        background-size: 400% 400%;
        animation: ambient-background-animation 45s ease infinite;
        transition: animation-duration 2s;
        pointer-events: none;
      }
      .chatbot-container.ai-thinking::before {
        animation-duration: 15s;
      }
      .chatbot-container > * {
        position: relative;
        z-index: 1;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

}
</script>
</head>
